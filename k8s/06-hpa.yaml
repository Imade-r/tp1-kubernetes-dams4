apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: b-hpa
  namespace: chaine-tp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: b
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
