apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chaine-ingress
  namespace: chaine-tp
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: a
                port:
                  number: 80
